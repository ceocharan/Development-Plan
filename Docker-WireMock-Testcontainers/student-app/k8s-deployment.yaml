apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
spec:
  selector:
    matchLabels:
      app: student-app
  replicas: 3
  template:
    metadata:
      labels:
        app: student-app
    spec:
      containers:
        - name: student-app
          image: student-app:65
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080